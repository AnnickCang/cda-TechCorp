<!--<header class="app__header topbar">-->
<header>
  <!-- Bouton visible sur mobile uniquement : ouvre et ferme la navigation. -->
  <button
    class="topbar__menu"
    type="button"
    aria-controls="navigation"
    [attr.aria-expanded]="topbarNavOpen()"
    (click)="menuToggle.emit()"
  >
    <svg
      class="nav__icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <path d="M4 6h16M4 12h16M4 18h16" />
    </svg>
    <span class="sr-only">Menu</span>
  </button>

  <a class="brand" href="/">
    <img class="brand__logo" src="logo.svg" alt="" width="32" height="32" />
    {{ topbarAppName() }}
  </a>

  <div class="topbar__actions">
    <div class="user">
      <span class="avatar" aria-hidden="true">CM</span>
      <div class="user__info">
        <p class="user__name">{{ currentUser().firstName }} {{ currentUser().lastName }}</p>
        <p class="user__role">{{ currentUser().jobTitle }}</p>
      </div>
    </div>
  </div>
</header>
