<!-- Premier element focusable : permet de sauter la navigation au clavier. -->
<a class="skip-link" href="#contenu">Aller au contenu principal</a>

<!-- [class.app--nav-open] : la classe est ajoutee quand navOpen() vaut true (seance 4). -->
<div class="app" [class.app--nav-open]="navOpen()">
  <app-topbar
    [topbarAppName]="appName"
    [currentUser]="currentUser"
    initials="CM"
    [topbarNavOpen]="navOpen()"
    (menuToggle)="toggleNav()"
  />

  <app-sidebar />

  <!-- tabindex="-1" : la cible du lien d'evitement peut recevoir le focus. -->
  <main class="app__main" id="contenu" tabindex="-1">
    <div class="container">
      <div class="page-header">
        <div>
          <h1>Bonjour {{ currentUser.firstName }}</h1>
          <ul class="grid-auto list" role="list">
            <li>
              <app-stat-card label="Congés payés restants" [value]="10" unit="jours" [max]="25" />
            </li>
            <li><app-stat-card label="RTT restants" [value]="6" unit="jours" /></li>
          </ul>
        </div>
      </div>

      <!-- Les pages de l'application s'afficheront ici (seance 5 : routage). -->
      <router-outlet />
    </div>
  </main>
</div>

<router-outlet />
