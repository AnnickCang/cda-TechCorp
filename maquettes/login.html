<!doctype html>
<!-- lang : langue de la page, utilisee par les lecteurs d'ecran et les moteurs de recherche. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Sans cette balise, le mobile affiche la page en version desktop dezoomee. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Titre unique par page : "Nom de la page - Nom du site". C'est ce qui
       s'affiche dans l'onglet, l'historique et les resultats de recherche. -->
    <title>Connexion - TechCorp RH</title>
    <meta name="description" content="Page de connexion à l'application." />

    <!-- Application interne : pas d'indexation par les moteurs de recherche. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="css/main.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="auth">
      <header class="auth__aside"></header>
      <main class="auth__main">
        <h1>Connexion</h1>
        <p>Utilisez votre adresse e-mail professionnelle</p>
        <div class="field">
          <label for="login" class="field__label">Adresse e-mail</label>
          <input type="text" class="input" id="field-login" />
        </div>
        <div class="field">
          <label for="password" class="field__label">Mot de passe</label>
          <input type="text" class="input" id="field-password" />
        </div>
        <footer>
          <a href="">Mentions légales</a>
          <a href="">Politique de confidentialité</a>
          <a href="">Accessibilité : partiellement conforme</a>
        </footer>
      </main>
    </div>
  </body>
</html>
