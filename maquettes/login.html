<!doctype html>
<!-- lang : langue de la page, utilisee par les lecteurs d'ecran et les moteurs de recherche. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Sans cette balise, le mobile affiche la page en version desktop dezoomee. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Titre unique par page : "Nom de la page - Nom du site". C'est ce qui
       s'affiche dans l'onglet, l'historique et les resultats de recherche. -->
    <title>Connexion - TechCorp RH</title>
    <meta name="description" content="Page de connexion à l'application." />

    <!-- Application interne : pas d'indexation par les moteurs de recherche. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="css/main.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="auth">
      <div class="auth__aside">
        <header class="auth__header">
          <img
            class="entreprise__logo"
            src="/maquettes/assets/logo.svg"
            alt="Logo TechCorp"
          />
          <h2>TechCorp RH</h2>
        </header>
        <div class="aside__content">
          <p>
            Vos congés, votre matériel et vos notes de frais, au même endroit
          </p>
          <p>La plateforme RH interne de TechCorp</p>
        </div>
        <footer class="aside__footer">TechCorp 2026</footer>
      </div>
      <main class="auth__main"></main>
    </div>
  </body>
</html>
